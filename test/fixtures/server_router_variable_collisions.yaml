openapi: 3.0.3
info:
  title: Router Variable Collision Test API
  version: 1.0.0
paths:
  /items/{filter_deep}:
    post:
      operationId: updateItem
      parameters:
        - name: filter_deep
          in: path
          required: true
          schema:
            type: string
        - name: filter
          in: query
          style: deepObject
          explode: true
          required: true
          schema:
            type: object
            required: [name]
            properties:
              name:
                type: string
        - name: checked_body
          in: query
          required: true
          schema:
            type: string
        - name: body_result
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
      responses:
        "200":
          description: ok
  /things/{checked_body}/{body_result}:
    post:
      operationId: updateThing
      parameters:
        - name: checked_body
          in: path
          required: true
          schema:
            type: string
        - name: body_result
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
      responses:
        "200":
          description: ok
