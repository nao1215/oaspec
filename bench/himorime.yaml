# yaml-language-server: $schema=https://raw.githubusercontent.com/nao1215/himorime/main/schema/himorime.schema.json
#
# oaspec measured end to end with himorime (https://github.com/nao1215/himorime):
# the escript a user starts, from the first instruction of the BEAM to its exit.
#
#   just bench          measure the working tree
#   just bench-compare  compare main with the working tree
#
# On a pull request, .github/workflows/bench.yml runs `himorime ci bench`:
# the base of the pull request and its head are built and measured in
# interleaved rounds on the same runner. See bench/README.md.
#
# Inputs are generated by gen.sh before measuring. Both revisions run the
# working tree's gen.sh (${head_root}), so they read the same bytes.
#
# oaspec works on one OpenAPI document per call, so the number in a
# benchmark name is the number of operations in that document: 10, where
# starting the BEAM dominates, and 500, where parsing, resolving and code
# generation do. generate runs `gleam format` on what it writes, so gleam
# must be on PATH; that child process is part of what is measured, as it
# is for a user.
version: "1"

name: oaspec
description: Start-up, validating and generating Gleam code from OpenAPI documents of 10 and 500 operations, the --check drift test and a failing validation.

# The escript is what users download from the GitHub Release (release.yml
# builds it the same way). gleescript packs the BEAM files under build/, so
# oaspec itself is compiled first; `gleam run -m gleescript` alone compiles
# only the dependency it runs.
build:
  command:
    - sh
    - -c
    - |
      set -e
      gleam build
      gleam run -m gleescript -- --out=build/himorime
      cp build/himorime/oaspec "$1"
    - sh
    - "${artifact}"
  cwd: ..

defaults:
  warmup: 2
  runs: 20
  # oaspec reads no configuration from HOME, but keep HOME inside the
  # benchmark's own directory so nothing of the developer's environment can
  # leak in.
  env:
    HOME: "${workdir}"
    XDG_CONFIG_HOME: "${workdir}/.config"
  metrics:
    cpu: true
    memory: true
  regression:
    confidence: 0.95
    latency:
      max_percent: 10
      min_difference: 1ms
    cpu_total:
      max_percent: 15
      min_difference: 2ms
    peak_rss:
      max_percent: 15
      min_difference: 2MiB

benchmarks:
  - name: version
    description: Starting the oaspec escript on the BEAM and exiting.
    tags: [smoke]
    commands:
      oaspec:
        command: ["${artifact}", version]

  - name: validate 10
    description: A document of 10 operations parsed, resolved and checked without writing code. Starting the BEAM dominates.
    tags: [smoke]
    setup:
      # The benchmark's cwd applies to setup too, and it does not exist yet.
      - command: [sh, "${head_root}/gen.sh", project, "10", "${workdir}/project"]
        cwd: "${workdir}"
    cwd: "${workdir}/project"
    commands:
      oaspec:
        command: ["${artifact}", validate, --config=oaspec.yaml]

  - name: validate 500
    description: A document of 500 operations (about 400 KB) parsed, resolved and checked without writing code.
    tags: [large]
    setup:
      - command: [sh, "${head_root}/gen.sh", project, "500", "${workdir}/project"]
        cwd: "${workdir}"
    cwd: "${workdir}/project"
    metrics:
      throughput:
        work: {value: 500, unit: operations}
    commands:
      oaspec:
        command: ["${artifact}", validate, --config=oaspec.yaml]

  - name: generate 10
    description: >-
      Server and client code generated from a document of 10 operations and
      formatted with gleam format, for --mode both (the default), server and
      client. The output directory is removed before every run, outside the
      measured time, so every run writes every file.
    tags: [smoke]
    setup:
      - command: [sh, "${head_root}/gen.sh", project, "10", "${workdir}/project"]
        cwd: "${workdir}"
    prepare_each:
      - command: [rm, -rf, "${workdir}/project/generated"]
    cwd: "${workdir}/project"
    baseline: both
    commands:
      both:
        command: ["${artifact}", generate, --config=oaspec.yaml]
      server:
        command: ["${artifact}", generate, --config=oaspec.yaml, --mode=server]
      client:
        command: ["${artifact}", generate, --config=oaspec.yaml, --mode=client]

  - name: generate 500
    description: The same three modes on a document of 500 operations, where parsing, code generation and gleam format dominate.
    tags: [large]
    setup:
      - command: [sh, "${head_root}/gen.sh", project, "500", "${workdir}/project"]
        cwd: "${workdir}"
    prepare_each:
      - command: [rm, -rf, "${workdir}/project/generated"]
    cwd: "${workdir}/project"
    baseline: both
    metrics:
      throughput:
        work: {value: 500, unit: operations}
    commands:
      both:
        command: ["${artifact}", generate, --config=oaspec.yaml]
      server:
        command: ["${artifact}", generate, --config=oaspec.yaml, --mode=server]
      client:
        command: ["${artifact}", generate, --config=oaspec.yaml, --mode=client]

  - name: generate check 500
    description: >-
      generate --check on a document of 500 operations whose output is up to
      date, as a CI job runs it: the code is generated and formatted in a
      temporary directory and compared with the files on disk.
    tags: [large]
    setup:
      - command: [sh, "${head_root}/gen.sh", project, "500", "${workdir}/project"]
        cwd: "${workdir}"
      # Written by the oaspec of the revision measured, so --check passes.
      - command: ["${artifact}", generate, --config=oaspec.yaml]
    cwd: "${workdir}/project"
    metrics:
      throughput:
        work: {value: 500, unit: operations}
    commands:
      oaspec:
        command: ["${artifact}", generate, --config=oaspec.yaml, --check]

  - name: validate error
    description: A document without its required info object, which fails validation with exit 1.
    tags: [smoke]
    setup:
      - command: [sh, "${head_root}/gen.sh", broken, "10", "${workdir}/project"]
        cwd: "${workdir}"
    cwd: "${workdir}/project"
    exit_codes: [1]
    commands:
      oaspec:
        command: ["${artifact}", validate, --config=oaspec.yaml]
