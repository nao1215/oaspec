name: Benchmark

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# oaspec is measured end to end with himorime, from bench/himorime.yaml.
#
# On a pull request, `himorime ci` checks the base of the pull request out
# into a temporary worktree, builds the escript of it and of the head with
# the same Gleam and OTP, and measures both in interleaved rounds on this
# runner, so a noisy neighbour slows both revisions instead of one. The job
# fails when the head is slower, uses more CPU time or more memory than the
# base beyond the tolerance of the suite with 95% confidence; a difference
# too close to call is inconclusive and does not fail it. The comparison is
# written to the job summary.
#
# Started by hand, the job measures the ref it runs on without comparing.
#
# Gleam and OTP are the latest lane of ci-tests.yml. `generate` runs
# `gleam format` on what it writes, so the gleam installed here is part of
# what is measured, the same for both revisions.
#
# Each revision downloads its dependencies from Hex when it is built. A
# read-only key moves those calls from the per-IP rate limit shared by
# GitHub-hosted runners to a per-key limit; an unset secret expands to an
# empty value, which Gleam treats as no key.
env:
  HEXPM_READ_API_KEY: ${{ secrets.HEXPM_READ_API_KEY }}

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The base commit must exist locally for the temporary worktree.
          fetch-depth: 0
          persist-credentials: false
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.x"
          rebar3-version: "3"
      - uses: nao1215/setup-himorime@14aeeb3fe55ad42cf29ee0802d578820faac3897 # v0.1.2
        with:
          version: v0.4.1
      - name: Compare the base with the head
        if: github.event_name == 'pull_request'
        run: himorime ci --output "$RUNNER_TEMP/himorime.json" --format json bench
      - name: Measure
        if: github.event_name != 'pull_request'
        run: himorime run --output "$RUNNER_TEMP/himorime.json" --format json --summary "$GITHUB_STEP_SUMMARY" bench
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: himorime-report
          path: ${{ runner.temp }}/himorime.json
          retention-days: 7
