name: Adapters

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: adapters-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter:
    # Both adapters declare the same `gleam` floor as the root package
    # (keep adapters/*/gleam.toml, gleam.toml and this matrix in sync).
    name: ${{ matrix.adapter }} (Gleam ${{ matrix.lane.gleam }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [httpc, fetch]
        lane:
          - { gleam: "1.14.0", otp: "27" }
          - { gleam: "1.x", otp: "29" }
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.lane.otp }}
          gleam-version: ${{ matrix.lane.gleam }}
          rebar3-version: "3"

      - name: Cache Gleam build for adapter
        uses: actions/cache@v6
        with:
          path: |
            adapters/${{ matrix.adapter }}/build/packages
            ~/.cache/gleam
          key: ${{ runner.os }}-gleam-adapter-${{ matrix.adapter }}-${{ hashFiles(format('adapters/{0}/manifest.toml', matrix.adapter), format('adapters/{0}/gleam.toml', matrix.adapter)) }}
          restore-keys: |
            ${{ runner.os }}-gleam-adapter-${{ matrix.adapter }}-

      - name: Build adapter
        working-directory: adapters/${{ matrix.adapter }}
        run: |
          gleam deps download
          gleam build --warnings-as-errors
