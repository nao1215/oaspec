name: Adapters

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: adapters-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  adapter:
    # Both adapters declare the same `gleam` floor as the root package
    # (keep adapters/*/gleam.toml, gleam.toml and this matrix in sync).
    name: ${{ matrix.adapter }} (Gleam ${{ matrix.lane.gleam }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [httpc, fetch]
        lane:
          - { gleam: "1.14.0", otp: "27" }
          - { gleam: "1.x", otp: "29" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.lane.otp }}
          gleam-version: ${{ matrix.lane.gleam }}
          rebar3-version: "3"

      - name: Cache Gleam build for adapter
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            adapters/${{ matrix.adapter }}/build/packages
            ~/.cache/gleam
          key: ${{ runner.os }}-gleam-adapter-${{ matrix.adapter }}-${{ hashFiles(format('adapters/{0}/manifest.toml', matrix.adapter), format('adapters/{0}/gleam.toml', matrix.adapter)) }}
          restore-keys: |
            ${{ runner.os }}-gleam-adapter-${{ matrix.adapter }}-

      - name: Build adapter
        working-directory: adapters/${{ matrix.adapter }}
        run: |
          gleam deps download
          gleam build --warnings-as-errors

      # Only the httpc adapter has tests: they run against local TCP
      # servers on the BEAM, while fetch needs a JavaScript runtime.
      - name: Test adapter
        if: matrix.adapter == 'httpc'
        working-directory: adapters/httpc
        run: gleam test
