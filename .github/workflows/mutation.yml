name: Mutation testing

# Mutants of the modules a pull request or push changes, with
# `gleam run -m metamon/mutation`. A survivor that doc/mutation/baseline.json
# does not list fails the job. The weekly run mutates every module; it has
# about 1000 mutants and the suite takes about 15 seconds, so it is split
# into 2 parts that run in parallel and a job that joins them.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changed:
    name: Mutation testing
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          gleam-version: "1.x"
          rebar3-version: "3"
      - run: gleam deps download
      - name: Pick the modules to mutate
        id: files
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ ! -f doc/mutation/baseline.json ]; then
            echo "No baseline yet: run this workflow by hand and record it."
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only --diff-filter=AMR "$BASE"...HEAD -- 'src/*.gleam' 'src/**/*.gleam' | tr '\n' ' ')
          else
            # Every commit of the push. A new branch has no previous tip.
            case "$BEFORE" in
              ""|0000000000000000000000000000000000000000) BEFORE=HEAD~1 ;;
            esac
            files=$(git diff --name-only --diff-filter=AMR "$BEFORE" HEAD -- 'src/*.gleam' 'src/**/*.gleam' | tr '\n' ' ')
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: Mutate the changed modules
        if: steps.files.outputs.files != ''
        env:
          FILES: ${{ steps.files.outputs.files }}
        run: |
          set -e
          gleam run -m metamon/mutation -- doc-check
          # shellcheck disable=SC2086
          gleam run -m metamon/mutation -- run --workers 4 $FILES
          gleam run -m metamon/mutation -- gate

  part:
    name: Mutation testing (part ${{ matrix.part }} of 2)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          gleam-version: "1.x"
          rebar3-version: "3"
      - run: gleam deps download
      - run: gleam run -m metamon/mutation -- run --workers 4 --shard ${{ matrix.part }}/2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-${{ matrix.part }}
          path: build/mutation/results.json

  merge:
    name: Mutation testing (all parts)
    needs: part
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          gleam-version: "1.x"
          rebar3-version: "3"
      - run: gleam deps download
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-*
          path: parts
      - run: gleam run -m metamon/mutation -- merge parts/*/results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-results
          path: build/mutation/results.json
      - name: Gate
        run: |
          if [ -f doc/mutation/baseline.json ]; then
            gleam run -m metamon/mutation -- doc-check
            gleam run -m metamon/mutation -- gate
          else
            echo "No baseline yet: download mutation-results to build/mutation/results.json and run gleam run -m metamon/mutation -- baseline"
          fi
