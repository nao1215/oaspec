name: Quick

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quick-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick:
    name: Format / typecheck / lint / sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Latest Gleam 1.x: formatter output changes between compiler releases,
      # and .mise.toml pins the same line for local `just format`.
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          gleam-version: "1.x"
          rebar3-version: "3"

      - name: Cache Gleam deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/packages
            ~/.cache/gleam
          key: ${{ runner.os }}-gleam-deps-${{ hashFiles('manifest.toml', 'gleam.toml') }}
          restore-keys: |
            ${{ runner.os }}-gleam-deps-

      - name: Download dependencies
        run: gleam deps download

      - name: Format check
        run: gleam format --check src/ test/

      - name: Type check
        run: gleam check

      - name: Lint (glinter, strict)
        run: gleam run -m glinter -- --stats

      - name: Check version and count sync
        run: bash scripts/check_sync.sh
