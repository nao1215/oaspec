name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Read-only Hex key for dependency resolution in the integration tests; see the
# note in ci-tests.yml. Publishing still uses HEXPM_API_KEY in the publish job.
env:
  HEXPM_READ_API_KEY: ${{ secrets.HEXPM_READ_API_KEY }}

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    # Signs SHA256SUMS with cosign keyless (id-token) and writes a GitHub
    # attestation for the escript (attestations).
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      # base64 of SHA256SUMS: the subjects the SLSA provenance job attests.
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The escript attached to the GitHub Release is compiled here, so OTP
      # stays on the documented minimum (27): BEAM files built by a newer OTP
      # are not guaranteed to load on an older one. The compiler follows the
      # latest 1.x lane in CI because `gleam format --check` runs below.
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "27"
          gleam-version: "1.x"
          rebar3-version: "3"

      - uses: nao1215/setup-atago@5c563dcd9d85e114f8abe8bbdcd058e51de09efb # v0.1.3
        with:
          version: v0.25.2

      - name: Download dependencies
        run: gleam deps download

      - name: Format check
        run: gleam format --check src/ test/

      - name: Type check
        run: gleam check

      - name: Build (warnings as errors)
        run: gleam build --warnings-as-errors

      - name: Unit tests
        run: gleam test

      # Packed from the production Erlang shipment, so the escript carries
      # oaspec and its runtime dependencies only (scripts/escript.erl).
      - name: Build escript binary
        run: sh scripts/build_escript.sh oaspec

      - name: atago E2E tests
        run: atago run --ci --report gha --parallel 1 ./e2e
        env:
          OASPEC_BIN: ${{ github.workspace }}/oaspec

      - name: Integration tests
        run: bash integration_test/run.sh

      - name: Smoke-test built escript
        run: bash scripts/smoke_escript.sh ./oaspec

      # Everything below runs before the Release exists, so a failure here
      # stops the release instead of leaving an unsigned one behind.
      - name: Check the escript carries no test modules
        run: python3 scripts/supply_chain.py contents oaspec --strict

      - name: SBOM (CycloneDX, from the escript's contents)
        run: python3 scripts/supply_chain.py sbom --manifest manifest.toml --escript oaspec --out oaspec.cdx.json

      - name: Check dependency licenses and bundle their texts
        run: |
          python3 scripts/supply_chain.py licenses --manifest manifest.toml --escript oaspec --bundle third_party_licenses
          tar -czf oaspec-third-party-licenses.tar.gz third_party_licenses

      - name: Checksums
        run: sha256sum oaspec oaspec.cdx.json oaspec-third-party-licenses.tar.gz > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums (cosign keyless)
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            oaspec
            oaspec.cdx.json
            oaspec-third-party-licenses.tar.gz
            SHA256SUMS

      - name: Provenance subjects
        id: hash
        run: echo "hashes=$(base64 -w0 < SHA256SUMS)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oaspec
          path: |
            oaspec
            oaspec.cdx.json
            oaspec-third-party-licenses.tar.gz
            SHA256SUMS
            SHA256SUMS.sigstore.json

  publish:
    name: Publish to Hex
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "27"
          gleam-version: "1.x"
          rebar3-version: "3"

      - run: gleam deps download
      - run: gleam build
      - run: echo 'I am not using semantic versioning' | gleam publish -y
        env:
          HEXPM_API_KEY: ${{ secrets.HEXPM_API_KEY }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oaspec

      - name: Make binary executable
        run: chmod +x oaspec

      - name: Extract tag name
        id: tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this version
        id: changelog
        run: |
          TAG="${{ steps.tag.outputs.TAG_NAME }}"
          TAG_WITHOUT_V="${TAG#v}"

          CHANGELOG_FILE="changelog_content.md"

          awk -v ver="$TAG_WITHOUT_V" '
            BEGIN { found = 0; }
            $0 ~ "^#{2,3} \\[?" ver "\\]?" { found = 1; next; }
            /^#{2,3} \[?[0-9]+\.[0-9]+\.[0-9]+\]?/ { if (found) exit; }
            found { print; }
          ' CHANGELOG.md > "$CHANGELOG_FILE"

          if [ ! -s "$CHANGELOG_FILE" ]; then
            awk -v ver="$TAG" '
              BEGIN { found = 0; }
              $0 ~ "^#{2,3} \\[?" ver "\\]?" { found = 1; next; }
              /^#{2,3} \[?v?[0-9]+\.[0-9]+\.[0-9]+\]?/ { if (found) exit; }
              found { print; }
            ' CHANGELOG.md > "$CHANGELOG_FILE"
          fi

          if [ ! -s "$CHANGELOG_FILE" ]; then
            echo "No changelog entry found for version $TAG" > "$CHANGELOG_FILE"
            echo "" >> "$CHANGELOG_FILE"
            echo "Please check CHANGELOG.md for updates." >> "$CHANGELOG_FILE"
          fi

          {
            echo 'CHANGELOG_CONTENT<<EOF'
            cat "$CHANGELOG_FILE"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: ${{ steps.tag.outputs.TAG_NAME }}
          body: |
            ${{ steps.changelog.outputs.CHANGELOG_CONTENT }}

            ## Install

            Download the `oaspec` escript binary below and place it on your PATH.
            Requires Erlang/OTP runtime.

            ```sh
            chmod +x oaspec
            ./oaspec generate --config=oaspec.yaml
            ```

            `SHA256SUMS` is signed with cosign (`SHA256SUMS.sigstore.json`), and SLSA provenance is attached. See "Verifying release integrity" in the README.
          files: |
            oaspec
            oaspec.cdx.json
            oaspec-third-party-licenses.tar.gz
            SHA256SUMS
            SHA256SUMS.sigstore.json
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.TAG_NAME, '-alpha') || contains(steps.tag.outputs.TAG_NAME, '-beta') || contains(steps.tag.outputs.TAG_NAME, '-rc') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SLSA build provenance as a release asset (multiple.intoto.jsonl). The GitHub
  # attestation in the build job is kept, but it is not a release asset, so it is
  # invisible to anyone who only has the downloaded files and to OpenSSF
  # Scorecard's Signed-Releases check. The generator must be referenced by tag,
  # not by commit SHA: slsa-verifier checks the reusable workflow's ref.
  provenance:
    name: SLSA provenance
    needs: [build, release]
    permissions:
      actions: read # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true

  # Verify the published escript against the published provenance and
  # signature, the way a user would, so a release that does not verify fails.
  verification:
    name: Verify release assets
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install the verifier
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVENANCE: "${{ needs.provenance.outputs.provenance-name }}"
        run: |
          set -euo pipefail
          gh -R "$GITHUB_REPOSITORY" release download "$GITHUB_REF_NAME" \
            -p oaspec -p oaspec.cdx.json -p oaspec-third-party-licenses.tar.gz \
            -p SHA256SUMS -p SHA256SUMS.sigstore.json -p "$PROVENANCE"

      - name: Verify checksums, signature and provenance
        env:
          PROVENANCE: "${{ needs.provenance.outputs.provenance-name }}"
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity-regexp "^https://github.com/$GITHUB_REPOSITORY/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS
          slsa-verifier verify-artifact --provenance-path "$PROVENANCE" \
            --source-uri "github.com/$GITHUB_REPOSITORY" \
            --source-tag "$GITHUB_REF_NAME" \
            oaspec
