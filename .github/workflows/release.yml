name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Read-only Hex key for dependency resolution in the integration tests; see the
# note in ci-tests.yml. Publishing still uses HEXPM_API_KEY in the publish job.
env:
  HEXPM_READ_API_KEY: ${{ secrets.HEXPM_READ_API_KEY }}

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The escript attached to the GitHub Release is compiled here, so OTP
      # stays on the documented minimum (27): BEAM files built by a newer OTP
      # are not guaranteed to load on an older one. The compiler follows the
      # latest 1.x lane in CI because `gleam format --check` runs below.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.x"
          rebar3-version: "3"

      - uses: nao1215/setup-atago@5c563dcd9d85e114f8abe8bbdcd058e51de09efb # v0.1.3
        with:
          version: v0.22.0

      - name: Download dependencies
        run: gleam deps download

      - name: Format check
        run: gleam format --check src/ test/

      - name: Type check
        run: gleam check

      - name: Build (warnings as errors)
        run: gleam build --warnings-as-errors

      - name: Unit tests
        run: gleam test

      - name: Build escript binary
        run: gleam run -m gleescript

      - name: atago E2E tests
        run: atago run --ci --report gha --parallel 1 ./e2e
        env:
          OASPEC_BIN: ${{ github.workspace }}/oaspec

      - name: Integration tests
        run: bash integration_test/run.sh

      - name: Smoke-test built escript
        run: bash scripts/smoke_escript.sh ./oaspec

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: oaspec
          path: oaspec

  publish:
    name: Publish to Hex
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.x"
          rebar3-version: "3"

      - run: gleam deps download
      - run: gleam build
      - run: echo 'I am not using semantic versioning' | gleam publish -y
        env:
          HEXPM_API_KEY: ${{ secrets.HEXPM_API_KEY }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: oaspec

      - name: Make binary executable
        run: chmod +x oaspec

      - name: Extract tag name
        id: tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this version
        id: changelog
        run: |
          TAG="${{ steps.tag.outputs.TAG_NAME }}"
          TAG_WITHOUT_V="${TAG#v}"

          CHANGELOG_FILE="changelog_content.md"

          awk -v ver="$TAG_WITHOUT_V" '
            BEGIN { found = 0; }
            $0 ~ "^#{2,3} \\[?" ver "\\]?" { found = 1; next; }
            /^#{2,3} \[?[0-9]+\.[0-9]+\.[0-9]+\]?/ { if (found) exit; }
            found { print; }
          ' CHANGELOG.md > "$CHANGELOG_FILE"

          if [ ! -s "$CHANGELOG_FILE" ]; then
            awk -v ver="$TAG" '
              BEGIN { found = 0; }
              $0 ~ "^#{2,3} \\[?" ver "\\]?" { found = 1; next; }
              /^#{2,3} \[?v?[0-9]+\.[0-9]+\.[0-9]+\]?/ { if (found) exit; }
              found { print; }
            ' CHANGELOG.md > "$CHANGELOG_FILE"
          fi

          if [ ! -s "$CHANGELOG_FILE" ]; then
            echo "No changelog entry found for version $TAG" > "$CHANGELOG_FILE"
            echo "" >> "$CHANGELOG_FILE"
            echo "Please check CHANGELOG.md for updates." >> "$CHANGELOG_FILE"
          fi

          {
            echo 'CHANGELOG_CONTENT<<EOF'
            cat "$CHANGELOG_FILE"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: ${{ steps.tag.outputs.TAG_NAME }}
          body: |
            ${{ steps.changelog.outputs.CHANGELOG_CONTENT }}

            ## Install

            Download the `oaspec` escript binary below and place it on your PATH.
            Requires Erlang/OTP runtime.

            ```sh
            chmod +x oaspec
            ./oaspec generate --config=oaspec.yaml
            ```
          files: oaspec
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.TAG_NAME, '-alpha') || contains(steps.tag.outputs.TAG_NAME, '-beta') || contains(steps.tag.outputs.TAG_NAME, '-rc') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
